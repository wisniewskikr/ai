                  - text: "role and a small poller to your Host Desk); unzip it where you unzipped the S04E01 zip, or ask your harness to fetch and place it. Skipped earlier days? Take “Host Desk @ day 4” (contains the answers of earlier days: do them first if you can). Its city tax lines are one host’s: put in yours from your S04E03 owner page. Start the night: your desk handles Host Desk events while you don’t type. Optional: “start later” on your owner page, at a time you choose."
            - generic [ref=e37]:
              - term [ref=e38]: Your harness does
              - definition [ref=e39]: It sets the desk up, starts the night, keeps the desk running for the whole window; after the window, it runs the payout batch on the bookings as they are now.
            - generic [ref=e40]:
              - term [ref=e41]: You need
              - definition [ref=e42]: Your Host Desk (or “Host Desk @ day 4”), your model key from S04E01, about 30 minutes.
            - generic [ref=e43]:
              - term [ref=e44]: Done when
              - definition [ref=e45]: Every event gets its result within 2 minutes, your desk’s job is still running when the night closes, and the payout batch passes.
          - generic [ref=e46]:
            - paragraph [ref=e47]: All of this week’s Challenges are a simulation. Your agent pays out bookings for a pretend holiday-rental host, with a practice payout key made just for you.
            - paragraph [ref=e48]:
              - text: For each task, your agent sends back
              - code [ref=e49]: "{answer}"
              - text: ", or"
              - code [ref=e50]: "{flag: \"needs-owner\", reason}"
              - text: when it shouldn’t handle that task on its own. You decide each flagged task, and then your agent finishes it.
            - paragraph [ref=e51]: In real life these events come at times you don’t control, over hours or days, while you sleep. Here they come over 10 minutes so you can watch your desk work.
            - paragraph [ref=e52]:
              - strong [ref=e53]: "The Pi way:"
              - text: "Run your desk on Pi Durable: it keeps running when your chat and laptop close, and wakes when there is work."
          - paragraph [ref=e54]: Your harness is your AI agent plus the tools, sign-ins and skills you give it.
